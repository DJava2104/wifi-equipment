<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление — Wi-Fi Speed Calculator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body">

    {% set d = draft or {} %}

    <div class="phone">
        <header class="screen-header">
            <h1>Добавление</h1>
        </header>

        <main class="screen-scroll">
            {% if d.id_equipment %}
            <form class="add-form" method="post" action="/publish">
                <p class="section-label">Параметры устройства</p>

                <label class="field">
                    <span>Название</span>
                    <input type="text" value="{{ d.title or '' }}" readonly>
                </label>

                <label class="field">
                    <span>Стандарт Wi-Fi</span>
                    <input type="text" name="standard" value="{{ d.standard or '' }}" placeholder="Wi-Fi 6 (802.11ax)" required>
                </label>

                <label class="field">
                    <span>Максимальная скорость (Мбит/с)</span>
                    <input type="number" name="max_speed" value="{{ d.max_speed or '' }}" placeholder="1200" required>
                </label>

                <label class="field">
                    <span>Частота (ГГц)</span>
                    <input type="number" step="0.1" min="0" name="frequency" value="{{ d.frequency or '' }}" placeholder="5.0" required>
                </label>

                <div class="add-section">
                    <p>Описание</p>
                    <textarea name="description" rows="4" placeholder="Краткое описание" required>{{ d.description or '' }}</textarea>
                </div>

                <button type="submit" class="btn">Опубликовать</button>
            </form>
            {% else %}
            <form class="add-form" method="post" action="/add">
                <div class="add-section">
                    <label class="drop-zone">
                        <input type="file" accept="image/*">
                        <span>📷<br>Изображение</span>
                    </label>
                    <label class="drop-zone">
                        <input type="file" accept="video/*">
                        <span>🎥<br>Видео</span>
                    </label>
                </div>

                <p class="section-label">Параметры устройства</p>

                <label class="field">
                    <span>Название</span>
                    <input type="text" name="title" value="{{ d.title or '' }}" placeholder="Название устройства" required>
                </label>

                <button type="submit" class="btn">Далее</button>
            </form>
            {% endif %}
        </main>

        <nav class="bottom-nav">
            <a href="/feed/1" class="nav-tab">📱 Лента</a>
            <a href="/add" class="nav-tab">➕ Добавление</a>
            <a href="/grid" class="nav-tab">📒 Плитка</a>
        </nav>
    </div>

    <script>
    document.querySelectorAll('.drop-zone input[type="file"]').forEach(input => {
        input.addEventListener('change', e => {
            const label = e.target.closest('label');
            const url = URL.createObjectURL(e.target.files[0]);
            const tag = e.target.accept.startsWith('video') ? 'video' : 'img';
            const el = document.createElement(tag);
            el.src = url;
            if (tag === 'video') el.autoplay = el.loop = el.muted = true;
            Object.assign(el.style, {maxHeight:'200px',width:'auto',objectFit:'contain',borderRadius:'inherit'});
            label.querySelector('span').style.display = 'none';
            const old = label.querySelector('img,video'); if(old) old.remove();
            label.appendChild(el);
        });
    });
    </script>

</body>
</html>

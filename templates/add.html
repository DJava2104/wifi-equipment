<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление — Wi-Fi Speed Calculator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body">

    {% set d = draft or {} %}

    <div class="phone">
        <header class="screen-header">
            <h1>Добавление</h1>
        </header>

        <main class="screen-scroll">
            <form class="add-form" method="get" action="/add">

                <div class="media-block">
                    <img class="upload-preview"
                         src="{{ d.image_url or '/static/img/default.svg' }}"
                         alt="Фото устройства">
                    <label class="upload-box">
                        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        <span>Фото устройства</span>
                        <input type="file" accept="image/*">
                    </label>
                </div>

                <div class="media-block">
                    <video class="upload-preview" autoplay loop muted playsinline
                           poster="{{ d.image_url or '/static/img/default.svg' }}">
                        <source src="{{ d.video_url or '/static/img/default.mp4' }}" type="video/mp4">
                    </video>
                    <label class="upload-box">
                        <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                        <span>Видеообзор</span>
                        <input type="file" accept="video/*">
                    </label>
                </div>

                <p class="section-label">Параметры устройства</p>

                <label class="field">
                    <span>Название</span>
                    <input type="text" name="title" value="{{ d.title or '' }}" placeholder="Название устройства">
                </label>

                <label class="field">
                    <span>Описание</span>
                    <textarea name="description" rows="4" placeholder="Краткое описание">{{ d.description or '' }}</textarea>
                </label>

                <label class="field">
                    <span>Диапазон (ГГц)</span>
                    <input type="number" name="band" min="2.4" max="6" step="0.1"
                           value="{{ d.band if d.band else '' }}" placeholder="5.0">
                </label>

                <label class="field">
                    <span>Антенны</span>
                    <input type="number" name="antennas" min="1" step="1"
                           value="{{ d.antennas if d.antennas else '' }}" placeholder="4">
                </label>

            </form>
        </main>

          <nav class="bottom-nav">
            <a href="/feed" class="nav-tab nav-active">📱 Лента</a>
            <a href="/add" class="nav-tab">➕ Добавление</a>
            <a href="/grid" class="nav-tab">📒 Плитка</a>
        </nav>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление — Wi-Fi Speed Calculator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body">

    {% set d = draft or {} %}

    <div class="phone">
        <header class="screen-header">
            <h1>Добавление</h1>
        </header>

        <main class="screen-scroll">
            <form class="add-form" method="get" action="/add">

                <div class="add-section">
                        <label class="drop-zone">
                            <input type="file" accept="image/*">
                            <span>📷<br>Изображение</span>
                        </label>
                        <label class="drop-zone">
                            <input type="file" accept="video/*">
                            <span>🎥<br>Видео</span>
                        </label>
                </div>

                <p class="section-label">Параметры устройства</p>

                <label class="field">
                    <span>Название</span>
                    <input type="text" name="title" value="{{ d.title or '' }}" placeholder="Название устройства">
                </label>

                <label class="field">
                    <span>Описание</span>
                    <textarea name="description" rows="4" placeholder="Краткое описание">{{ d.description or '' }}</textarea>
                </label>

                <label class="field">
                    <span>Диапазон (ГГц)</span>
                    <input type="number" name="band" min="2.4" max="6" step="0.1"
                           value="{{ d.band if d.band else '' }}" placeholder="5.0">
                </label>

                <label class="field">
                    <span>Антенны</span>
                    <input type="number" name="antennas" min="1" step="1"
                           value="{{ d.antennas if d.antennas else '' }}" placeholder="4">
                </label>

            </form>
        </main>

          <nav class="bottom-nav">
            <a href="/feed" class="nav-tab nav-active">📱 Лента</a>
            <a href="/add" class="nav-tab">➕ Добавление</a>
            <a href="/grid" class="nav-tab">📒 Плитка</a>
        </nav>
    </div>

</body>
</html>

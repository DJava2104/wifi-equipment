<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Wi-Fi Speed Calculator</title>
        <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body class="app-body">
        <main class="main-grid">
            
            <div class="content-area">
                <h2>Новое устройство</h2>
                {% if draft %}
                <form action="/publish" method="POST" class="add-form">
                    <div class="add-section">
                        <p>Максимальная скорость (Мбит/с)</p>
                        <input type="number" name="max_speed" value="{{ draft.max_speed }}" placeholder="Скорость">
                        <p>Стандарт Wi-Fi</p>
                        <input type="text" name="standard" value="{{ draft.standard }}" placeholder="Wi-Fi 6 (802.11ax)">
                        <p>Описание</p>
                        <textarea name="description" rows="4" placeholder="Описание">{{ draft.description }}</textarea>
                    </div>
                    <button type="submit" class="btn">Опубликовать</button>
                </form>
                {% else %}
                <form action="/add" method="POST" class="add-form">
                    <div class="add-section">
                        <label class="drop-zone">
                            <input type="file" accept="image/*">
                            <span>📷<br>Изображение</span>
                        </label>
                        <label class="drop-zone">
                            <input type="file" accept="video/*">
                            <span>🎥<br>Видео</span>
                        </label>
                    </div>
                    <div class="add-section">
                        <p>Название</p>
                        <input type="text" name="title" placeholder="Название устройства">
                    </div>
                    <button type="submit" class="btn">Далее</button>
                </form>
                {% endif %}
            </div>
            <div class="tab-bar">
                <a href="/feed/1" class="tab-btn">📱<br>Лента</a>
                <div class="tab-btn tab-active">📝<br>Добавление</div>
                <a href="/grid" class="tab-btn">📊<br>Плитка</a>
            </div>
            
        </main>
    <script>
    document.querySelectorAll('.drop-zone input[type="file"]').forEach(input => {
        input.addEventListener('change', e => {
            const label = e.target.closest('label');
            const url = URL.createObjectURL(e.target.files[0]);
            const tag = e.target.accept.startsWith('video') ? 'video' : 'img';
            const el = document.createElement(tag);
            el.src = url;
            if (tag === 'video') el.autoplay = el.loop = el.muted = true;
            Object.assign(el.style, {maxHeight:'200px',width:'auto',objectFit:'contain',borderRadius:'inherit'});
            label.querySelector('span').style.display = 'none';
            const old = label.querySelector('img,video'); if(old) old.remove();
            label.appendChild(el);
        });
    });
    </script>
    </body>
</html>

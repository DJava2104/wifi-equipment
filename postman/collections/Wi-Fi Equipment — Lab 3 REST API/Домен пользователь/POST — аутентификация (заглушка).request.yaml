$kind: http-request
description: "Аутентификация — заглушка для 4-й лабораторной. Ответ: {message: stub}."
url: "{{base_url}}/api/login"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: username
      value: user_0
    - type: text
      key: password
      value: password
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test('Заглушка stub', () => pm.expect(data.message).to.eql('stub'));
    language: text/javascript
order: 2000

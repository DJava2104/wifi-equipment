$kind: http-request
name: GET — лента по ид (next=true)
description: "Лента по ид: следующее опубликованное после указанного (переход по кругу) + like_count + is_liked (0/1)."
url: "{{base_url}}/api/router/1?next=true"
method: GET
auth:
  type: noauth
queryParams:
  - key: next
    value: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test('Следующее опубликованное устройство', () => pm.expect(data.id_routers).to.not.equal(1));
      pm.test('Признак is_liked (0/1)', () => pm.expect(data.is_liked).to.be.oneOf([0, 1]));
    language: text/javascript
order: 2500
